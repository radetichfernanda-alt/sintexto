<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIN TEXTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Mano Verde";src:url(fonts/ManoVerde-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Mano Verde";src:url(fonts/ManoVerde-Bold.woff2) format("woff2");font-weight:700}
:root{--pink:#f0679b;--ink:#2f8a3e;--ink2:#1f5f2a;--pale:#eaf4ec;--txt:#1b1b1b;--mut:#6b6b6b;--hand:"Mano Verde",cursive;--sans:"Instrument Sans",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--txt);font-family:var(--sans)}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1;margin:0;color:var(--ink);letter-spacing:.02em}
.sub{font-size:14px;color:var(--mut);margin:6px 0 0}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--ink);color:var(--ink);padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:600 14px var(--sans);background:#fff;color:var(--ink2);border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--pale)} .btn[aria-pressed=true]{background:var(--ink);color:#fff}
.hand:focus,.town:focus{outline:none}.btn:focus-visible,.hand:focus-visible,.town:focus-visible{outline:2px dashed var(--pink);outline-offset:3px}
#crumb{position:relative;z-index:6;font-family:var(--hand);font-size:22px;color:var(--ink);margin:10px 0 0;min-height:28px}
#crumb button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:4px}
#stage{position:relative;width:100%;aspect-ratio:1000/620;overflow:hidden;overflow:clip}
.scene{position:absolute;inset:0;width:100%;height:100%;transition:transform .9s cubic-bezier(.6,.05,.25,1),opacity .6s}
.scene.off{opacity:0;pointer-events:none}
svg text{font-family:var(--hand)}
.hand{cursor:pointer}
.hand .pin{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}.hand:hover .pin,.hand:focus .pin,.hand.on .pin{transform:translateY(-5px) scale(1.18)}
.hand .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@keyframes wave{0%,100%{transform:rotate(0) scale(1.12)}25%{transform:rotate(-14deg) scale(1.12)}75%{transform:rotate(12deg) scale(1.12)}}
.hand .pop{animation:pop .5s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.hand .pop{transform-box:fill-box;transform-origin:50% 50%}
.town{cursor:pointer}.town:hover .tl{fill:var(--ink2)}.town:hover circle.d{r:13}
.tip{position:absolute;pointer-events:none;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:4px 10px;font-family:var(--hand);font-size:20px;color:var(--ink2);transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .15s}
/* ficha */
#main{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start;margin-top:6px}
#main,#main.has{grid-template-columns:1fr}
#veil{position:fixed;inset:0;background:rgba(255,255,255,.72);opacity:0;pointer-events:none;transition:opacity .3s;z-index:4}
#veil.on{opacity:1;pointer-events:auto}
#card{position:fixed;left:50%;top:3vh;width:min(920px,94vw);max-height:94vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 20px 60px rgba(0,0,0,.18);padding:22px 22px 16px;z-index:5;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .3s,transform .3s}
#card.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#card .foto img{width:100%;height:auto;display:block;border-radius:4px}
#card .foto .pend{aspect-ratio:3/2}
#card.fade{opacity:0}
#card .intro h3{font-family:var(--hand);font-weight:700;color:var(--ink);font-size:28px;margin:0 0 8px;line-height:1}
#card .intro p{font-size:14.5px;line-height:1.45;margin:0 0 12px}
.leg{display:flex;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.leg svg{flex:0 0 34px}
#card .x{position:absolute;z-index:3;background:#fff!important;border-radius:50%;width:34px;height:34px;line-height:30px;top:8px;right:10px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--mut)}
.cgrid{display:grid;grid-template-columns:44% 1fr;gap:16px}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;aspect-ratio:300/380;transition:transform .7s;transform-style:preserve-3d}
.flip.b .in{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;backface-visibility:hidden}
.flip .f svg{width:100%;height:100%;display:block}
.flip .bk{transform:rotateY(180deg)}
.fbtn{margin-top:8px;width:100%;font-size:13px;padding:6px}
.where{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.names{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1.02;color:var(--ink);margin:4px 0 12px}
.ced{border-top:1.5px solid var(--txt);padding-top:8px;font-size:13.5px;line-height:1.4}
.ced .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.ced .t{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.1}
.quote{font-family:var(--serif);font-size:17px;line-height:1.3;margin:12px 0 0;color:#333}
.nav{display:flex;justify-content:space-between;margin-top:14px;border-top:1px dashed #cfcfcf;padding-top:10px}
.nav button{font:600 13px var(--sans);background:none;border:none;color:var(--ink2);cursor:pointer;padding:4px}
#card .flip .in{aspect-ratio:3/2}
#card img{display:block}
.flip .f img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.flip .ph{width:100%;height:100%;display:flex;justify-content:center;background:#f6f6f6}.flip .ph svg{height:100%;width:auto}
.obras{display:flex;gap:8px;height:100%;justify-content:center;align-items:center;background:#f4f1ea;border-radius:3px;padding:10px}
.obras img{max-height:100%;max-width:48%;object-fit:contain;box-shadow:0 3px 10px rgba(0,0,0,.2);border:6px solid #fff}
.obras img:only-child{max-width:100%}
#card .where{margin-top:14px}#card .ced{margin-top:10px}
.also{margin-top:14px}.also .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.also button{border:none;background:none;padding:0;margin:0 8px 0 0;cursor:pointer;width:96px;text-align:left;font:12px var(--sans);color:var(--ink2);vertical-align:top}
.also img{width:96px;aspect-ratio:3/2;object-fit:cover;border-radius:3px;margin-bottom:3px}
.cnt{font-size:12px;color:var(--mut);align-self:center}
.pol img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.pol{width:200px}
.ig{display:inline-block;margin:-6px 0 10px;font:600 14px var(--sans);color:var(--pink);text-decoration:none;border-bottom:1.5px solid var(--pink)}
.ig:hover{color:#c74679}
.note{margin-top:14px;background:#fdf0f5;border-left:3px solid var(--pink);padding:10px 12px;font-size:13.5px;line-height:1.45;border-radius:0 4px 4px 0}
.note .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#c74679;margin-bottom:4px}
.note a{color:#c74679;font-weight:600}
.obras.many{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.obras.many img{max-width:100%;max-height:none;width:100%;aspect-ratio:1;object-fit:cover;border-width:3px}
.olist{list-style:none;margin:4px 0 0;padding:0}.olist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #ddd;padding:5px 0;font-size:13.5px}.olist i{font-family:var(--serif);font-size:17px}.olist span{color:var(--mut);text-align:right}
.members{font-size:13px;line-height:1.4;color:#444;margin:0 0 10px}
.also span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.also .more{display:inline-block;font-size:12px;color:var(--mut);vertical-align:top;margin-top:20px}
.obras:not(.many) img{height:100%;width:auto;max-height:100%;min-height:0}
.obras:not(.many) img:not(:only-child){height:auto;max-width:48%;max-height:100%}
.pend{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fdf0f5;border:2px dashed var(--pink);border-radius:4px}.pend span{font-family:var(--hand);font-size:28px;color:var(--pink)}
.ced .art{font-weight:700;font-size:20px;margin-top:2px}.ced .tm{font-size:18px;margin:2px 0 8px}.ced .ing{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.olist .lt{font-size:14px;text-align:left;flex:1}.olist li span:last-child{flex:0 0 auto;max-width:40%}
.ced .don{font-size:13.5px;margin:-4px 0 8px}.ced .don a{color:var(--pink);font-weight:600}
.obras .pend.sm{width:46%;height:90%}.obras .pend.sm:only-child{width:100%}.obras .pend.sm span{font-size:20px;text-align:center}
#logos{display:flex;align-items:center;gap:22px;margin-top:18px}
#logos .lr{height:56px;width:auto}#logos .lm{height:74px;width:auto}
@media (max-width:760px){#logos{gap:16px}#logos .lr{height:36px}#logos .lm{height:48px}}
#swipe{display:none;font-family:var(--hand);color:var(--mut);font-size:17px;text-align:center;margin-top:4px;transition:opacity .4s}#swipe.gone{opacity:0}
/* álbum */
#album{display:none;margin-top:8px}
#album.on{display:block}
#album h2{font-family:var(--hand);font-weight:700;color:var(--ink);font-size:30px;margin:18px 0 8px}
.pol{display:inline-block;width:150px;margin:0 14px 18px 0;background:#fff;padding:8px 8px 6px;box-shadow:0 3px 14px rgba(0,0,0,.12);cursor:pointer;vertical-align:top;transition:transform .2s;border:none;text-align:left;font:inherit}
.pol:nth-child(odd){transform:rotate(-1.6deg)}.pol:nth-child(even){transform:rotate(1.3deg)}
.pol:hover{transform:rotate(0) scale(1.05)}
.pol svg{width:100%;display:block;aspect-ratio:300/380}
.pol b{display:block;font-family:var(--hand);font-size:20px;color:var(--ink2);margin-top:4px;font-weight:700}
.pol span{font-size:11px;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
@media (max-width:760px){
 #main{grid-template-columns:1fr}
 #stage.town{aspect-ratio:auto;height:calc(min(190vw,780px)*.62);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 #stage.town::-webkit-scrollbar{display:none}
 #stage.town .scene{width:min(190vw,780px);right:auto}
 #stage.town .scene.off{display:none}
 #swipe{display:block}
 #card{left:0;right:0;bottom:0;top:auto;width:auto;max-height:88vh;border-radius:16px 16px 0 0;padding:16px 16px 14px;opacity:1;transform:translateY(105%);transition:transform .35s;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
 #card.open{transform:none}
 #card .intro{display:none}
 .names{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>
